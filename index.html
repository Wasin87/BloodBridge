<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodBridge | Smart Campus Blood Donation & Emergency Network</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="BloodBridge - Smart Campus Blood Donation & Emergency Network. Connect with student donors, post emergency blood requests, and save lives in real-time." />
    <meta name="keywords" content="blood donation, blood bridge, campus blood directory, blood donor, emergency blood requests, student blood bank, find blood donors, save lives, smart blood network" />
    <meta name="author" content="BloodBridge" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#E11D48" />

    <!-- Favicon Configuration -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BloodBridge | Smart Campus Blood Donation & Emergency Network" />
    <meta property="og:description" content="Connect instantly with student donors, post emergency blood requests, and save lives through a fast, reliable campus blood bridge." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="BloodBridge" />

    <!-- Twitter Card SEO -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="BloodBridge | Smart Campus Blood Donation Network" />
    <meta property="twitter:description" content="Emergency blood requests, real-time campus donation directories, and seamless student donor matching." />
    <meta property="twitter:image" content="/favicon.svg" />

    <script>
      // Suppress benign Vite WebSocket/HMR connection errors in the preview sandbox
      window.addEventListener('error', function(event) {
        if (
          event.message && (
            event.message.indexOf('WebSocket') !== -1 ||
            event.message.indexOf('[vite]') !== -1 ||
            event.message.indexOf('websocket') !== -1
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason) {
          const reasonStr = String(event.reason);
          if (
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('websocket') !== -1 ||
            reasonStr.indexOf('Vite') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
